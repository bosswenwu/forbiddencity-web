  const vs=speechSynthesis.getVoices().filter(v=>/^zh(-|_)?(CN|Hans)?/i.test(v.lang)&&!/HK|TW/i.test(v.lang));

}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function subtitle(text){const e=$('#subtitle');e.textContent=text||'';e.classList.toggle('visible',!!text)}
function stopNarration(){Narr.token++;Narr.speaking=false;if('speechSynthesis' in window)speechSynthesis.cancel();subtitle('');if(Sound.amb&&Sound.ctx)Sound.amb.gain.setTargetAtTime(1,Sound.ctx.currentTime,.4)}
function sayLine(text,token){
  return new Promise(done=>{
    if(token!==Narr.token)return done();

    u.onend=end;u.onerror=end;speechSynthesis.speak(u);

  const text=NARRATION[name];if(!Narr.on||!text)return;
  const token=Narr.token;Narr.speaking=true;
  if(Sound.amb&&Sound.ctx)Sound.amb.gain.setTargetAtTime(.45,Sound.ctx.currentTime,.3);
  for(const line of text.split('。').filter(Boolean)){await sayLine(line+'。',token);if(token!==Narr.token)return}
  stopNarration();
}
$('#narrBtn').classList.toggle('active',Narr.on);
$('#narrBtn').onclick=()=>{Narr.on=!Narr.on;$('#narrBtn').classList.toggle('active',Narr.on);if(Narr.on){toast(Narr.voice?'解说已开启 · '+Narr.voice.name.replace(/Microsoft |Google /,''):'解说已开启 · 本机没有中文语音，显示字幕');narrate(LANDMARKS[current].name)}else{stopNarration();toast('解说已关闭')}};
$('#soundBtn').onclick=()=>{setSound(!Sound.on);toast(Sound.on?'宫廷声景：风、鸟、水声、古琴与脚步':'声景已关闭')};

// ===== 自动导览：镜头飞行到下一处 → 敲钟 → 解说 → 继续 =====
const Tour={active:false,flight:null,token:0};
// 正面观赏机位：保持原取景距离，但不能退进前一座建筑（含台基）里
function focusPose(i){const l=LANDMARKS[i];let z=l.z+(l.type==='bridge'?34:(l.d||15)*1.65+17);const prev=LANDMARKS[i-1];if(prev&&prev.type!=='bridge'){const back=prev.z-(prev.d||15)/2-(prev.type==='garden'?0:3.5)-1.5;z=Math.min(z,back)}return{pos:new THREE.Vector3(0,l.type==='bridge'?9:8.5,z),yaw:0,pitch:l.type==='bridge'?-.24:-.075}}
function flyTo(i){
  const to=focusPose(i),from=camera.position.clone(),dist=from.distanceTo(to.pos);
  return new Promise(done=>{Tour.flight={from,to,y0:yaw,p0:pitch,t:0,t0:performance.now(),dur:clamp(dist/45,1.4,4.2),arc:Math.min(28,dist*.12),done};mode='tour';fly=true});
}
function flightTick(dt){
  const f=Tour.flight;if(!f)return;
  f.t=Math.min(1,(performance.now()-f.t0)/1000/f.dur);   // 按真实时间推进，低帧率设备也不会拖慢
  const k=f.t<.5?4*f.t*f.t*f.t:1-Math.pow(-2*f.t+2,3)/2;
  camera.position.lerpVectors(f.from,f.to.pos,k);camera.position.y+=Math.sin(Math.PI*k)*f.arc;
  yaw=f.y0+(f.to.yaw-f.y0)*k;pitch=f.p0+(f.to.pitch-f.p0)*k;velocity.set(0,0,0);
  if(f.t>=1){Tour.flight=null;f.done()}
}
async function autoTour(from){
  stopTour();Tour.active=true;const token=++Tour.token;
  $('#tourBtn').classList.add('active');$('#tourBtn').textContent='停止导览';
  document.body.classList.remove('intro-mode');$('#intro').classList.add('hidden');
  if(!Sound.ctx)setSound(true);
  toast('自动导览 · 沿中轴依次讲解 11 处地标');
  for(let i=from;i<LANDMARKS.length;i++){
    setPlace(i);await flyTo(i);if(token!==Tour.token)return;
    arrive(i,true);await narrateAndWait(LANDMARKS[i].name,token);if(token!==Tour.token)return;
    await new Promise(r=>setTimeout(r,900));if(token!==Tour.token)return;
  }
  stopTour();toast('中轴导览结束 · 可继续自由漫游');
}
async function narrateAndWait(name,token){
  if(!Narr.on){await new Promise(r=>setTimeout(r,3500));return}
  await narrate(name);
}
function arrive(i,silentToast){const l=LANDMARKS[i],p=focusPose(i);camera.position.copy(p.pos);yaw=p.yaw;pitch=p.pitch;fly=false;mode='tour';bell();if(!silentToast)toast(l.name+' · '+l.en)}
function stopTour(){
  if(!Tour.active&&!Tour.flight)return;
  Tour.token++;Tour.active=false;
  if(Tour.flight){const f=Tour.flight;Tour.flight=null;f.done()}
  stopNarration();fly=false;
  $('#tourBtn').classList.remove('active');$('#tourBtn').textContent='导览';
}
// 用户手动操作时让出控制权
addEventListener('keydown',e=>{if(Tour.active&&/^(Key[WASD]|Arrow|Space|ShiftLeft)/.test(e.code))stopTour()});
renderer.domElement.addEventListener('pointerdown',()=>{if(Tour.active&&Tour.flight==null)stopTour()});
const joystick=$('#joystick'),stick=$('#stick');function joyMove(e){const r=joystick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y),m=Math.min(36,len),nx=len?x/len:0,ny=len?y/len:0;joy.x=nx*m/36;joy.y=ny*m/36;stick.style.transform='translate('+nx*m+'px,'+ny*m+'px)'}joystick.addEventListener('pointerdown',e=>{try{joystick.setPointerCapture(e.pointerId)}catch(_){}joyMove(e)});joystick.addEventListener('pointermove',e=>{if(joystick.hasPointerCapture(e.pointerId))joyMove(e)});function joyEnd(){joy.x=joy.y=0;stick.style.transform='translate(0,0)'}joystick.addEventListener('pointerup',joyEnd);joystick.addEventListener('pointercancel',joyEnd);
const clock=new THREE.Clock();let fps=0,frames=0,elapsed=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(.04,clock.getDelta());frames++;elapsed+=dt;if(elapsed>.5){fps=Math.round(frames/elapsed);frames=0;elapsed=0}if(mode!=='intro'){const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),dir=new THREE.Vector3();if(keys.KeyW)dir.add(f);if(keys.KeyS)dir.sub(f);if(keys.KeyD)dir.add(r);if(keys.KeyA)dir.sub(r);dir.addScaledVector(r,joy.x);dir.addScaledVector(f,-joy.y);if(dir.lengthSq())dir.normalize();const speed=keys.ShiftLeft?28:13;velocity.x=dir.x*speed;velocity.z=dir.z*speed;if(fly)velocity.y=(keys.Space?12:0)-(keys.ControlLeft?12:0);else velocity.y+=-22*dt;camera.position.addScaledVector(velocity,dt);if(!fly&&camera.position.y<5.2){camera.position.y=5.2;velocity.y=0}camera.position.x=clamp(camera.position.x,-104,104);camera.position.z=clamp(camera.position.z,-286,286);camera.rotation.set(pitch,yaw,0,'YXZ');let nearest=0,dist=Infinity;LANDMARKS.forEach((l,i)=>{const d=Math.abs(camera.position.z-l.z);if(d<dist){dist=d;nearest=i}});if(nearest!==current&&mode==='walk')setPlace(nearest)}flightTick(dt);if(Tour.flight)camera.rotation.set(pitch,yaw,0,'YXZ');const hs=Math.hypot(velocity.x,velocity.z);soundTick(dt,mode!=='intro'&&hs>1,hs);waterTex.offset.y=clock.elapsedTime*.05;renderer.render(scene,camera)}animate();
window.__game={ready:true,autoTour,stopTour,start,aerial,focusLandmark,tourNext:()=>setPlace(current+1,true),teleportToLandmark:i=>{if(typeof i==='string')i=LANDMARKS.findIndex(l=>l.name===i||l.en===i);setPlace(i<0?0:i,true)},teleport:(x,y,z,lookYaw=0,lookPitch=0)=>{camera.position.set(x,y,z);yaw=lookYaw;pitch=lookPitch;mode='walk'},setJoystick:(x,y)=>{joy.x=clamp(x,-1,1);joy.y=clamp(y,-1,1)},setLook:(y,p)=>{yaw=y;pitch=p},setFly:v=>fly=!!v,state:()=>({ready:true,mode,currentLandmark:LANDMARKS[current].name,landmarks:LANDMARKS.length,position:camera.position.toArray(),yaw,pitch,fly,fps,meshes:meshCount,mobile:getComputedStyle($('#mobileControls')).display!=='none',introVisible:!$('#intro').classList.contains('hidden'),sound:Sound.on,narrating:Narr.speaking,voice:Narr.voice&&Narr.voice.name,autoTour:Tour.active,flying:!!Tour.flight,subtitle:$('#subtitle').textContent})};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>$('#loading').classList.add('hidden'),450);
</script>
